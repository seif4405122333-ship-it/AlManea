<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المنيع للصيانة | Al-Manea Maintenance</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--blue:#0b2a6f;--blue2:#14409c;--yel:#ffc400;--bg:#fff;--soft:#f3f6fc;--tx:#1b2438;--mut:#5b6679;--bd:#dfe5f1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--soft:#141c33;--tx:#eef2fb;--mut:#a5b0c8;--bd:#26304d}}
:root[data-theme="dark"]{--bg:#0e1424;--soft:#141c33;--tx:#eef2fb;--mut:#a5b0c8;--bd:#26304d}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx);line-height:1.8}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--blue);z-index:60}
.wrap{max-width:1100px;margin:auto;padding:0 18px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--blue);z-index:50;box-shadow:0 2px 12px #0004}
.nav{display:flex;align-items:center;gap:14px;height:68px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:900;font-size:1.2rem}
.brand img{height:50px;width:auto}
.links{display:flex;gap:4px;margin-inline-start:auto;flex-wrap:wrap}
.links a{color:#dbe5ff;text-decoration:none;padding:6px 11px;border-radius:8px;font-weight:600;font-size:.95rem}
.links a:hover{background:#ffffff1f;color:#fff}
.btn{display:inline-block;background:var(--yel);color:#1a1a1a;border:0;border-radius:10px;padding:10px 22px;font:700 1rem Cairo,sans-serif;cursor:pointer;text-decoration:none;box-shadow:0 3px 0 #c79a00}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.ghost{background:transparent;color:#fff;border:2px solid #fff6;box-shadow:none}
.lang{background:transparent;color:#fff;border:2px solid var(--yel);padding:5px 12px;border-radius:8px;font:700 .9rem Cairo;cursor:pointer}
.hero{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;padding:64px 0 76px}
.hero .wrap{display:grid;grid-template-columns:1.3fr 1fr;gap:30px;align-items:center}
.hero h1{font-size:2.5rem;line-height:1.4;margin:0 0 12px;font-weight:900}
.hero h1 span{color:var(--yel)}
.hero p{color:#d6e1ff;font-size:1.1rem;max-width:520px}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.crest{text-align:center}.crest img{width:min(260px,70%);filter:drop-shadow(0 10px 24px #0008)}
.stats{display:flex;gap:26px;margin-top:26px;flex-wrap:wrap}.stats b{display:block;font-size:1.7rem;color:var(--yel)}.stats small{color:#cfdbff}
section{padding:60px 0}.alt{background:var(--soft)}
h2{color:var(--blue);font-size:1.9rem;margin:0 0 6px;font-weight:900}
:root[data-theme="dark"] h2{color:var(--yel)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) h2{color:var(--yel)}}
h2::after{content:"";display:block;width:56px;height:5px;background:var(--yel);border-radius:4px;margin-top:6px}
.sub{color:var(--mut);margin:10px 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.card{background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:20px;border-top:4px solid var(--yel)}
.card .ic{color:var(--blue2)}.card .ic svg{width:46px;height:46px}.call svg{width:24px;height:24px}.ph svg{width:34%;height:auto}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .card .ic{color:#9db8ff}}.card h3{margin:6px 0 4px;color:var(--blue2);font-size:1.15rem}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .card h3{color:#9db8ff}}
.card p{margin:0;color:var(--mut);font-size:.95rem}
.about{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center}
.ticks{list-style:none;padding:0;margin:14px 0 0}.ticks li{padding:4px 0}.ticks li::before{content:"\2713";color:var(--blue);background:var(--yel);border-radius:50%;display:inline-block;width:24px;height:24px;text-align:center;line-height:24px;font-size:.8rem;margin-inline-end:10px}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.ph{aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,var(--blue),var(--blue2));display:flex;align-items:center;justify-content:center;color:#ffffffcc;position:relative}
.ph img{width:100%;height:100%;object-fit:cover}
.ph .up{position:absolute;bottom:8px;inset-inline-end:8px;font-size:.8rem;padding:4px 10px}
form,.rv{background:var(--bg);border:1px solid var(--bd);border-radius:16px;padding:22px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-weight:700;font-size:.92rem;margin-bottom:3px}
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--bd);border-radius:10px;font:inherit;background:var(--bg);color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:3px solid #ffc40066;border-color:var(--yel)}
.full{grid-column:1/-1}
.loc{font-size:.85rem;color:var(--mut);margin-top:4px}
.rvl{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:20px}
.rc{background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:16px;position:relative}
.rc b{color:var(--blue2)}.stars{color:var(--yel);letter-spacing:2px}
.del{position:absolute;top:8px;inset-inline-end:8px;background:#e53935;color:#fff;border:0;border-radius:8px;padding:3px 10px;cursor:pointer;font:600 .8rem Cairo}
.contact{display:flex;gap:14px;flex-wrap:wrap}.contact .card{flex:1 1 240px;text-align:center}
.contact a.btn{margin-top:10px}
footer{background:var(--blue);color:#cdd9fb;padding:24px 0;text-align:center;font-size:.92rem}
.wa{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));inset-inline-start:18px;width:60px;height:60px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px #0006;z-index:70}
.wa svg{width:34px;height:34px;fill:#fff}
.call{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));inset-inline-end:18px;height:60px;padding:0 20px;border-radius:30px;background:var(--yel);color:#111;font-weight:900;display:flex;align-items:center;gap:8px;text-decoration:none;box-shadow:0 6px 18px #0006;z-index:70}
.msg{margin-top:10px;font-weight:700}.ok{color:#1b8a3a}.er{color:#d32f2f}
@media(max-width:800px){.hero .wrap,.about{grid-template-columns:1fr}.hero h1{font-size:1.9rem}.crest{order:-1}.f2{grid-template-columns:1fr}.links{display:none}.nav .btn.ghost{display:none}.lang{margin-inline-start:auto}}
</style>
</head>
